scoring:
  title_match_weight: 2.4
  abstract_match_weight: 1.9
  author_keyword_weight: 0.3
  require_all_bonus: 2.8
  require_any_bonus: 1.2
  optional_group_bonus: 0.7
  title_alignment_bonus: 0.4
  bucket_base_bonus:
    core_llm_in_finance: 2.8
    finance_llm_tooling: 3.3
    adjacent_or_noise: -1.2
  llm_core_bonus: 1.1
  finance_scope_bonus: 1.3
  strong_outcome_bonus: 1.5
  abstract_signal_bonus: 0.9
  deprioritize_penalty_weight: 1.7
  tooling_focus_bonus: 2.4

buckets:
  core_llm_in_finance:
    require_all:
      - llm_core_terms
      - finance_scope_terms
    require_title_or_abstract_any:
      - llm_core_terms
    require_any:
      - finance_task_terms
      - finance_data_terms
      - strong_finance_outcome_terms
    optional_any:
      - llm_method_terms
      - finance_tooling_terms
    penalty_groups:
      - deprioritize_generic_ai_terms
    min_total_matches: 3
  finance_llm_tooling:
    require_all:
      - llm_core_terms
      - finance_scope_terms
      - finance_tooling_terms
    require_title_or_abstract_any:
      - llm_core_terms
    optional_any:
      - finance_data_terms
      - finance_task_terms
      - llm_method_terms
    penalty_groups:
      - deprioritize_generic_ai_terms
    min_total_matches: 3
  adjacent_or_noise:
    require_all:
      - finance_scope_terms
    require_any:
      - generic_ml_terms
      - llm_method_terms
      - finance_task_terms
      - finance_data_terms
      - finance_tooling_terms
    penalty_groups:
      - deprioritize_generic_ai_terms
    min_total_matches: 2

profiles:
  llm_finance:
    allowed_buckets:
      - core_llm_in_finance
      - finance_llm_tooling
      - adjacent_or_noise
    exclude:
      - exclude_terms
  finance_broad:
    require_any:
      - finance_scope_terms
      - finance_task_terms
      - finance_data_terms
      - strong_finance_outcome_terms
    optional_any:
      - llm_core_terms
      - llm_method_terms
      - finance_tooling_terms
    exclude:
      - exclude_terms
    min_total_matches: 1
  finance_ai_bridge:
    require_any:
      - finance_scope_terms
      - finance_task_terms
      - finance_data_terms
    optional_any:
      - llm_core_terms
      - llm_method_terms
      - finance_tooling_terms
    exclude:
      - exclude_terms
    min_total_matches: 2
